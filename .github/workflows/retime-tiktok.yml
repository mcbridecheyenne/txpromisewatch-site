name: Retime queued TikTok reels

# One-off: holds every picture in the queued TikTok reels 3 s longer
# (Cheyenne, 2026-11-11). Runs on pushes to the retime-tiktok branch.
on:
  push:
    branches: [retime-tiktok]
    paths: [scripts/retime_plan.json]

permissions:
  contents: write

concurrency:
  group: tiktok-music
  cancel-in-progress: false

jobs:
  retime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g postiz@2.0.27 --silent && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q numpy
      - name: Retime
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: |
          start=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ); end=$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)
          postiz posts:list --startDate "$start" --endDate "$end" > raw.txt
          sed -n '/^[[{]/,$p' raw.txt > plist.json
          python3 scripts/retime_queue.py plist.json scripts/retime_plan.json out || echo "SOME FAILED"
          mkdir -p retime-report && cp out/report.json out/*.jpg retime-report/
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add retime-report && git commit -qm "Retime report" && git pull -q --rebase && git push
