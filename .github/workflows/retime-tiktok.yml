name: Retime TikTok reels
on:
  push:
    branches: [retime-tiktok]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install -g postiz@2.0.27 --silent
      - name: Probe
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: |
          A="https://api.postiz.com/public/v1"
          for u in "posts/cmw2bp6jt0aw4l8085fc75n9x" "posts/group/7e20ce5a-ade6-4b4a-8e48-9464d64b5208"; do
            echo "== $u"; curl -s -H "Authorization: $POSTIZ_API_KEY" "$A/$u" | head -c 3000; echo
          done
          echo "== media"; postiz media:list 2>&1 | head -c 6000
