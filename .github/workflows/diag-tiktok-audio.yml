name: Diagnose TikTok audio (read-only)

on:
  push:
    branches: ["diag/tiktok-audio"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tools
        run: |
          npm install -g postiz --silent
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null
      - name: Inspect media and music search
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: bash diag/inspect2.sh
